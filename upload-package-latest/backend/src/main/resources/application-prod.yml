# ==================== 生产环境配置 ====================
# 通过 spring.profiles.active=prod 激活，覆盖主配置中的开发默认值。
# 注意：生产环境应通过环境变量或 .env 文件注入所有敏感信息。

spring:
  jpa:
    hibernate:
      # 生产环境使用 validate 策略，仅验证不自动修改表结构
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        # 生产环境关闭 SQL 格式化输出（减少日志体积）
        format_sql: false
  data:
    redis:
      repositories:
        enabled: false
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:3s}

server:
  # 生产环境端口，支持 PORT 或 SERVER_PORT 环境变量
  port: ${PORT:${SERVER_PORT:8080}}

app:
  # 生产环境文件存储路径（通常挂载到持久化磁盘）
  storage-dir: ${APP_STORAGE_DIR:/data/learning-assistant-files}
  cors:
    # 生产环境 CORS 白名单（仅允许前端部署域名）
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5174,http://127.0.0.1:5174}
  auth:
    # JWT 签名密钥（必须通过环境变量设置，不可使用默认值）
    secret: ${APP_AUTH_SECRET}
    # Token 有效期（秒）：默认 24 小时
    token-ttl-seconds: ${APP_AUTH_TOKEN_TTL_SECONDS:86400}
  admin:
    # 生产环境默认关闭自动初始化（建议手动管理管理员账户）
    bootstrap-enabled: ${APP_ADMIN_BOOTSTRAP_ENABLED:false}
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:}
    nickname: ${APP_ADMIN_NICKNAME:admin}
  redis:
    enabled: ${APP_REDIS_ENABLED:false}
  material:
    max-file-bytes: ${APP_MATERIAL_MAX_FILE_BYTES:524288000}
    max-temporary-file-bytes: ${APP_MATERIAL_MAX_TEMPORARY_FILE_BYTES:524288000}
    max-web-bytes: ${APP_MATERIAL_MAX_WEB_BYTES:10485760}
  security:
    outbound:
      # 生产环境禁止访问内网地址（防止 SSRF 攻击）
      allow-private-network: ${APP_OUTBOUND_ALLOW_PRIVATE_NETWORK:false}
      resolve-hosts: ${APP_OUTBOUND_RESOLVE_HOSTS:true}
    login-captcha:
      enabled: ${APP_LOGIN_CAPTCHA_ENABLED:true}
      failure-threshold: ${APP_LOGIN_CAPTCHA_FAILURE_THRESHOLD:3}
      ttl-seconds: ${APP_LOGIN_CAPTCHA_TTL_SECONDS:300}
    rate-limit:
      # 生产环境使用较严格的频率限制
      login-per-minute: ${APP_RATE_LIMIT_LOGIN_PER_MINUTE:10}
      register-per-minute: ${APP_RATE_LIMIT_REGISTER_PER_MINUTE:10}
      email-code-per-minute: ${APP_RATE_LIMIT_EMAIL_CODE_PER_MINUTE:6}
      llm-config-test-per-minute: ${APP_RATE_LIMIT_LLM_CONFIG_TEST_PER_MINUTE:5}
      rag-chat-per-minute: ${APP_RATE_LIMIT_RAG_CHAT_PER_MINUTE:30}
  email-code:
    # 生产环境默认禁用邮件验证码（按需开启）
    enabled: ${EMAIL_CODE_ENABLED:false}
    ttl-seconds: ${EMAIL_CODE_TTL_SECONDS:300}
    email-cooldown-seconds: ${EMAIL_CODE_EMAIL_COOLDOWN_SECONDS:60}
    ip-hourly-limit: ${EMAIL_CODE_IP_HOURLY_LIMIT:10}
    connect-timeout-millis: ${EMAIL_CODE_CONNECT_TIMEOUT_MILLIS:10000}
    timeout-millis: ${EMAIL_CODE_TIMEOUT_MILLIS:10000}
    write-timeout-millis: ${EMAIL_CODE_WRITE_TIMEOUT_MILLIS:10000}
    subject: ${EMAIL_CODE_SUBJECT:智学引擎登录验证码}
    from: ${EMAIL_CODE_FROM:${SMTP_USERNAME:}}
    default-provider: ${EMAIL_CODE_DEFAULT_PROVIDER:qq}
    # 生产环境邮件禁用时不输出验证码到日志（安全考虑）
    log-code-when-mail-disabled: ${EMAIL_CODE_LOG_WHEN_DISABLED:false}
    # QQ 邮箱 SMTP 配置
    qq:
      host: ${EMAIL_CODE_QQ_HOST:${SMTP_HOST:smtp.qq.com}}
      port: ${EMAIL_CODE_QQ_PORT:${SMTP_PORT:465}}
      username: ${EMAIL_CODE_QQ_USERNAME:${SMTP_USERNAME:}}
      password: ${EMAIL_CODE_QQ_PASSWORD:${SMTP_PASSWORD:}}
      from: ${EMAIL_CODE_QQ_FROM:${EMAIL_CODE_FROM:${SMTP_USERNAME:}}}
      auth: ${EMAIL_CODE_QQ_AUTH:${SMTP_AUTH:true}}
      ssl-enable: ${EMAIL_CODE_QQ_SSL_ENABLE:${SMTP_SSL_ENABLE:true}}
      starttls-enable: ${EMAIL_CODE_QQ_STARTTLS_ENABLE:${SMTP_STARTTLS_ENABLE:false}}
    # 网易 163 邮箱 SMTP 配置
    netease:
      host: ${EMAIL_CODE_NETEASE_HOST:smtp.163.com}
      port: ${EMAIL_CODE_NETEASE_PORT:465}
      username: ${EMAIL_CODE_NETEASE_USERNAME:}
      password: ${EMAIL_CODE_NETEASE_PASSWORD:}
      from: ${EMAIL_CODE_NETEASE_FROM:${EMAIL_CODE_NETEASE_USERNAME:}}
      auth: ${EMAIL_CODE_NETEASE_AUTH:true}
      ssl-enable: ${EMAIL_CODE_NETEASE_SSL_ENABLE:true}
      starttls-enable: ${EMAIL_CODE_NETEASE_STARTTLS_ENABLE:false}
  llm:
    # 生产环境默认启用 LLM（需配置 API 地址和密钥）
    enabled: ${LLM_ENABLED:true}
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}
    api-format: ${LLM_API_FORMAT:chat-completions}
    # 生产环境 LLM 超时时间较长（30 秒）
    timeout: ${LLM_TIMEOUT:30s}
  embedding:
    enabled: ${EMBEDDING_ENABLED:true}
    base-url: ${EMBEDDING_BASE_URL:https://api.voyageai.com}
    api-key: ${EMBEDDING_API_KEY:}
    model: ${EMBEDDING_MODEL:voyage-multimodal-3}
    timeout: ${EMBEDDING_TIMEOUT:30s}
    top-k: ${EMBEDDING_TOP_K:8}
    score-threshold: ${EMBEDDING_SCORE_THRESHOLD:0.35}
  ocr:
    # 生产环境默认关闭 OCR（按需开启，需安装 Tesseract）
    enabled: ${OCR_ENABLED:false}
    lang: ${OCR_LANG:eng+chi_sim}
    command: ${OCR_COMMAND:tesseract}
    command-template: ${OCR_COMMAND_TEMPLATE:}
    timeout: ${OCR_TIMEOUT:20s}
  document-preview:
    render-dpi: ${DOCUMENT_PREVIEW_RENDER_DPI:144}
    converter:
      enabled: ${DOCUMENT_PREVIEW_CONVERTER_ENABLED:true}
      command: ${DOCUMENT_PREVIEW_CONVERTER_COMMAND:soffice}
      timeout: ${DOCUMENT_PREVIEW_CONVERTER_TIMEOUT:60s}
  pdf:
    compression:
      # 大文件 PDF 压缩配置（使用 Ghostscript 降低扫描 PDF 体积）
      enabled: ${PDF_COMPRESSION_ENABLED:true}
      command: ${PDF_COMPRESSION_COMMAND:gs}
      command-template: ${PDF_COMPRESSION_COMMAND_TEMPLATE:}
      timeout: ${PDF_COMPRESSION_TIMEOUT:180s}
      # 仅对超过此大小（64MB）的 PDF 进行压缩
      min-bytes: ${PDF_COMPRESSION_MIN_BYTES:67108864}
      # 压缩目标 DPI
      target-dpi: ${PDF_COMPRESSION_TARGET_DPI:144}
