# ==================== 测试环境配置 ====================
# 此文件仅在运行单元测试/集成测试时生效，覆盖主配置以使用轻量级内存数据库和宽松限制。

spring:
  datasource:
    # 使用 H2 内存数据库模拟 MySQL 模式，测试结束后自动销毁
    url: jdbc:h2:mem:learning_assistant_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      # 每次测试启动时重建表结构，测试结束自动删除
      ddl-auto: create-drop
  flyway:
    # 测试环境禁用 Flyway 数据库迁移，由 JPA 自动建表
    enabled: false
  data:
    redis:
      repositories:
        enabled: false

app:
  admin:
    # 测试环境启用默认管理员自动创建
    bootstrap-enabled: true
    username: admin
    password: test-admin-123456
    nickname: admin
  material:
    # 测试环境文件大小限制（500MB）
    max-file-bytes: 524288000
    max-web-bytes: 524288000
  security:
    outbound:
      # 测试环境允许访问内网地址（如 localhost 嵌入服务）
      allow-private-network: true
      resolve-hosts: false
    login-captcha:
      # 测试环境启用登录验证码功能
      enabled: true
      failure-threshold: 3
      ttl-seconds: 300
    rate-limit:
      # 测试环境放宽所有频率限制，避免测试并发时被拦截
      login-per-minute: 1000
      register-per-minute: 1000
      email-code-per-minute: 1000
      llm-config-test-per-minute: 1000
      rag-chat-per-minute: 1000
  email-code:
    # 测试环境禁用真实邮件发送
    enabled: false
    ttl-seconds: 300
    # 测试环境取消发送冷却，加速测试执行
    email-cooldown-seconds: 0
    ip-hourly-limit: 100
    default-provider: qq
    # 邮件禁用时将验证码输出到日志，方便测试读取
    log-code-when-mail-disabled: true
  ocr:
    # OCR 功能默认关闭，通过环境变量 TEST_OCR_ENABLED=true 按需启用
    enabled: ${TEST_OCR_ENABLED:false}
    command-template: ${TEST_OCR_COMMAND_TEMPLATE:}
    timeout: 5s
  document-preview:
    converter:
      # 测试环境禁用文档格式转换器（如 LibreOffice）
      enabled: false
