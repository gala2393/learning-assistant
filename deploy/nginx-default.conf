server {
    listen 80;
    server_name learnstudy.cloud www.learnstudy.cloud _;

    return 301 https://www.learnstudy.cloud$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name learnstudy.cloud _;

    ssl_certificate /etc/nginx/ssl/learnstudy.cloud_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/learnstudy.cloud.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    return 301 https://www.learnstudy.cloud$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.learnstudy.cloud;

    client_max_body_size 500m;

    ssl_certificate /etc/nginx/ssl/learnstudy.cloud_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/learnstudy.cloud.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' http: https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # 资料阅读器页面图片缓存：已生成的 PDF/Office 页面图片内容稳定，允许浏览器私有缓存。
    location ~ ^/api/materials/[0-9]+/images/.+\.(png|jpg|jpeg|webp)$ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering on;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' http: https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control private,max-age=604800 always;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
