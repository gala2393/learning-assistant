spring:
  application:
    name: learning-assistant
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/learning_assistant?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  mvc:
    async:
      request-timeout: 120000
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          ssl:
            enable: ${SMTP_SSL_ENABLE:true}

server:
  port: 8080

app:
  storage-dir: ${APP_STORAGE_DIR:${user.dir}/target/learning-assistant-files}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,http://localhost:15174,http://127.0.0.1:15174}
  ocr:
    enabled: ${OCR_ENABLED:false}
    lang: ${OCR_LANG:eng+chi_sim}
    command: ${OCR_COMMAND:tesseract}
    command-template: ${OCR_COMMAND_TEMPLATE:}
    timeout: ${OCR_TIMEOUT:20s}
  document-preview:
    render-dpi: ${DOCUMENT_PREVIEW_RENDER_DPI:144}
    converter:
      enabled: ${DOCUMENT_PREVIEW_CONVERTER_ENABLED:true}
      command: ${DOCUMENT_PREVIEW_CONVERTER_COMMAND:soffice}
      timeout: ${DOCUMENT_PREVIEW_CONVERTER_TIMEOUT:60s}
  email-code:
    enabled: ${EMAIL_CODE_ENABLED:false}
    ttl-seconds: ${EMAIL_CODE_TTL_SECONDS:300}
    email-cooldown-seconds: ${EMAIL_CODE_EMAIL_COOLDOWN_SECONDS:60}
    ip-hourly-limit: ${EMAIL_CODE_IP_HOURLY_LIMIT:10}
    subject: ${EMAIL_CODE_SUBJECT:Learning Assistant Login Code}
    from: ${EMAIL_CODE_FROM:${SMTP_USERNAME:}}
    default-provider: ${EMAIL_CODE_DEFAULT_PROVIDER:qq}
    log-code-when-mail-disabled: ${EMAIL_CODE_LOG_WHEN_DISABLED:true}
    qq:
      host: ${EMAIL_CODE_QQ_HOST:${SMTP_HOST:smtp.qq.com}}
      port: ${EMAIL_CODE_QQ_PORT:${SMTP_PORT:465}}
      username: ${EMAIL_CODE_QQ_USERNAME:${SMTP_USERNAME:}}
      password: ${EMAIL_CODE_QQ_PASSWORD:${SMTP_PASSWORD:}}
      from: ${EMAIL_CODE_QQ_FROM:${EMAIL_CODE_FROM:${SMTP_USERNAME:}}}
      auth: ${EMAIL_CODE_QQ_AUTH:${SMTP_AUTH:true}}
      ssl-enable: ${EMAIL_CODE_QQ_SSL_ENABLE:${SMTP_SSL_ENABLE:true}}
    netease:
      host: ${EMAIL_CODE_NETEASE_HOST:smtp.163.com}
      port: ${EMAIL_CODE_NETEASE_PORT:465}
      username: ${EMAIL_CODE_NETEASE_USERNAME:}
      password: ${EMAIL_CODE_NETEASE_PASSWORD:}
      from: ${EMAIL_CODE_NETEASE_FROM:${EMAIL_CODE_NETEASE_USERNAME:}}
      auth: ${EMAIL_CODE_NETEASE_AUTH:true}
      ssl-enable: ${EMAIL_CODE_NETEASE_SSL_ENABLE:true}
  llm:
    enabled: ${LLM_ENABLED:false}
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}
    timeout: ${LLM_TIMEOUT:20s}
  embedding:
    enabled: ${EMBEDDING_ENABLED:false}
    base-url: ${EMBEDDING_BASE_URL:}
    api-key: ${EMBEDDING_API_KEY:}
    model: ${EMBEDDING_MODEL:text-embedding-v3}
    timeout: ${EMBEDDING_TIMEOUT:20s}
    top-k: ${EMBEDDING_TOP_K:5}
    score-threshold: ${EMBEDDING_SCORE_THRESHOLD:0.55}
