spring:
  application:
    name: learning-assistant
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/learning_assistant?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  mvc:
    async:
      request-timeout: 120000

server:
  port: 8080

app:
  storage-dir: ${APP_STORAGE_DIR:${user.dir}/target/learning-assistant-files}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,http://localhost:15174,http://127.0.0.1:15174}
  ocr:
    enabled: ${OCR_ENABLED:false}
    lang: ${OCR_LANG:eng+chi_sim}
    command: ${OCR_COMMAND:tesseract}
    command-template: ${OCR_COMMAND_TEMPLATE:}
    timeout: ${OCR_TIMEOUT:20s}
  document-preview:
    render-dpi: ${DOCUMENT_PREVIEW_RENDER_DPI:144}
    converter:
      enabled: ${DOCUMENT_PREVIEW_CONVERTER_ENABLED:true}
      command: ${DOCUMENT_PREVIEW_CONVERTER_COMMAND:soffice}
      timeout: ${DOCUMENT_PREVIEW_CONVERTER_TIMEOUT:60s}
  llm:
    enabled: ${LLM_ENABLED:false}
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}
    timeout: ${LLM_TIMEOUT:20s}
