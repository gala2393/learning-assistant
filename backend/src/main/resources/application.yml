# ==================== 智学引擎 主配置文件 ====================
# 所有配置项均支持通过环境变量覆盖，格式为 ${ENV_VAR:默认值}。

spring:
  application:
    name: learning-assistant
  datasource:
    # MySQL 数据库连接地址（支持 Unicode 和时区设置）
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/learning_assistant?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  jpa:
    hibernate:
      # 建表策略：validate=仅验证表结构不自动修改，启动时如表不匹配会报错
      ddl-auto: ${JPA_DDL_AUTO:validate}
    # 禁用 OSIV（Open Session In View），避免在视图层延迟加载引发问题
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    # 数据库版本迁移工具，自动执行 classpath:db/migration 下的 SQL 脚本
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    # 首次对已有数据库启用 Flyway 时自动创建基线
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    validate-on-migrate: true
  servlet:
    multipart:
      # 单文件和单次请求最大体积。持久资料走 1MB 分片上传；这里放宽用于兼容普通上传和临时资料。
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:2GB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:2GB}
  mvc:
    async:
      # 异步请求超时时间（如流式 SSE 响应），120 秒
      request-timeout: 120000
  mail:
    # SMTP 邮件发送配置（用于邮箱验证码）
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          ssl:
            enable: ${SMTP_SSL_ENABLE:true}
  data:
    redis:
      repositories:
        enabled: false
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:3s}

server:
  port: 8080

app:
  # 本地文件存储根目录（资料文件、页面图片等）
  storage-dir: ${APP_STORAGE_DIR:${user.dir}/target/learning-assistant-files}
  admin:
    # 默认管理员账户自动初始化开关（生产环境建议手动管理，关闭此项）
    bootstrap-enabled: ${APP_ADMIN_BOOTSTRAP_ENABLED:false}
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:}
    nickname: ${APP_ADMIN_NICKNAME:admin}
  redis:
    enabled: ${APP_REDIS_ENABLED:false}
  material:
    # 持久资料文件大小限制（字节）：2GB，大 PDF 通过分片上传后后台解析
    max-file-bytes: ${APP_MATERIAL_MAX_FILE_BYTES:2147483648}
    # 临时文件大小限制（字节）：100MB
    max-temporary-file-bytes: ${APP_MATERIAL_MAX_TEMPORARY_FILE_BYTES:104857600}
    # 智能问答临时资料全文保留时间，过期后自动清理数据库正文
    temporary-context-retention: ${APP_MATERIAL_TEMPORARY_CONTEXT_RETENTION:48h}
    temporary-context-cleanup-delay: ${APP_MATERIAL_TEMPORARY_CONTEXT_CLEANUP_DELAY:1h}
    # 网络资源下载大小限制（字节）：10MB
    max-web-bytes: ${APP_MATERIAL_MAX_WEB_BYTES:10485760}
  security:
    outbound:
      # 是否允许访问内网/私有网络地址（如内网嵌入服务）
      allow-private-network: ${APP_OUTBOUND_ALLOW_PRIVATE_NETWORK:false}
      # 是否对出站 URL 进行 DNS 解析验证
      resolve-hosts: ${APP_OUTBOUND_RESOLVE_HOSTS:true}
    login-captcha:
      # 登录验证码功能开关
      enabled: ${APP_LOGIN_CAPTCHA_ENABLED:true}
      # 连续登录失败多少次后要求输入验证码
      failure-threshold: ${APP_LOGIN_CAPTCHA_FAILURE_THRESHOLD:3}
      # 验证码有效期（秒）
      ttl-seconds: ${APP_LOGIN_CAPTCHA_TTL_SECONDS:300}
    rate-limit:
      # 各接口每分钟请求频率限制（防暴力破解和滥用）
      login-per-minute: ${APP_RATE_LIMIT_LOGIN_PER_MINUTE:10}
      register-per-minute: ${APP_RATE_LIMIT_REGISTER_PER_MINUTE:10}
      email-code-per-minute: ${APP_RATE_LIMIT_EMAIL_CODE_PER_MINUTE:6}
      llm-config-test-per-minute: ${APP_RATE_LIMIT_LLM_CONFIG_TEST_PER_MINUTE:5}
      rag-chat-per-minute: ${APP_RATE_LIMIT_RAG_CHAT_PER_MINUTE:30}
  cors:
    # 允许的跨域来源（前端开发服务器地址）
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175,http://localhost:15174,http://127.0.0.1:15174}
  ocr:
    # OCR 光学字符识别配置（用于扫描版 PDF 文本提取）
    enabled: ${OCR_ENABLED:true}
    # 识别语言（eng=英文，chi_sim=简体中文）
    lang: ${OCR_LANG:eng+chi_sim}
    command: ${OCR_COMMAND:C:/Program Files/Tesseract-OCR/tesseract.exe}
    command-template: '${OCR_COMMAND_TEMPLATE:"C:/Program Files/Tesseract-OCR/tesseract.exe" --tessdata-dir "C:/Users/23931/AppData/Local/Tesseract-OCR/tessdata" "{image}" stdout -l "{lang}"}'
    timeout: ${OCR_TIMEOUT:60s}
    # 内联 PDF OCR 处理的大小和页数限制
    inline-pdf-max-bytes: ${APP_OCR_INLINE_PDF_MAX_BYTES:524288000}
    inline-pdf-max-pages: ${APP_OCR_INLINE_PDF_MAX_PAGES:1000}
  document-preview:
    # 文档预览渲染 DPI（越高越清晰，文件越大）
    render-dpi: ${DOCUMENT_PREVIEW_RENDER_DPI:144}
    converter:
      # 文档格式转换器（DOCX/PPTX 转 PDF），需要 LibreOffice
      enabled: ${DOCUMENT_PREVIEW_CONVERTER_ENABLED:true}
      command: ${DOCUMENT_PREVIEW_CONVERTER_COMMAND:soffice}
      timeout: ${DOCUMENT_PREVIEW_CONVERTER_TIMEOUT:60s}
  pdf:
    # 大 PDF 快速导入阈值：超过该大小时使用分批轻量抽取，避免 PDFBox 全量加载卡住后台。
    large-fast-import-bytes: ${APP_PDF_LARGE_FAST_IMPORT_BYTES:134217728}
    # 大 PDF 快速导入时只抽取前 N 页文本进入问答索引，原文仍可在阅读器中查看。
    large-fast-import-max-text-pages: ${APP_PDF_LARGE_FAST_IMPORT_MAX_TEXT_PAGES:80}
  email-code:
    # 邮箱验证码登录功能配置
    enabled: ${EMAIL_CODE_ENABLED:false}
    # 验证码有效期（秒）
    ttl-seconds: ${EMAIL_CODE_TTL_SECONDS:300}
    # 同一邮箱连续发送冷却时间（秒）
    email-cooldown-seconds: ${EMAIL_CODE_EMAIL_COOLDOWN_SECONDS:60}
    # 同一 IP 每小时最大请求次数
    ip-hourly-limit: ${EMAIL_CODE_IP_HOURLY_LIMIT:10}
    # 邮件发送网络超时配置（毫秒）
    connect-timeout-millis: ${EMAIL_CODE_CONNECT_TIMEOUT_MILLIS:10000}
    timeout-millis: ${EMAIL_CODE_TIMEOUT_MILLIS:10000}
    write-timeout-millis: ${EMAIL_CODE_WRITE_TIMEOUT_MILLIS:10000}
    subject: ${EMAIL_CODE_SUBJECT:智学引擎登录验证码}
    from: ${EMAIL_CODE_FROM:${SMTP_USERNAME:}}
    default-provider: ${EMAIL_CODE_DEFAULT_PROVIDER:qq}
    # 邮件禁用时是否将验证码输出到日志
    log-code-when-mail-disabled: ${EMAIL_CODE_LOG_WHEN_DISABLED:true}
    # QQ 邮箱 SMTP 配置
    qq:
      host: ${EMAIL_CODE_QQ_HOST:${SMTP_HOST:smtp.qq.com}}
      port: ${EMAIL_CODE_QQ_PORT:${SMTP_PORT:465}}
      username: ${EMAIL_CODE_QQ_USERNAME:${SMTP_USERNAME:}}
      password: ${EMAIL_CODE_QQ_PASSWORD:${SMTP_PASSWORD:}}
      from: ${EMAIL_CODE_QQ_FROM:${EMAIL_CODE_FROM:${SMTP_USERNAME:}}}
      auth: ${EMAIL_CODE_QQ_AUTH:${SMTP_AUTH:true}}
      ssl-enable: ${EMAIL_CODE_QQ_SSL_ENABLE:${SMTP_SSL_ENABLE:true}}
      starttls-enable: ${EMAIL_CODE_QQ_STARTTLS_ENABLE:${SMTP_STARTTLS_ENABLE:false}}
    # 网易 163 邮箱 SMTP 配置
    netease:
      host: ${EMAIL_CODE_NETEASE_HOST:smtp.163.com}
      port: ${EMAIL_CODE_NETEASE_PORT:465}
      username: ${EMAIL_CODE_NETEASE_USERNAME:}
      password: ${EMAIL_CODE_NETEASE_PASSWORD:}
      from: ${EMAIL_CODE_NETEASE_FROM:${EMAIL_CODE_NETEASE_USERNAME:}}
      auth: ${EMAIL_CODE_NETEASE_AUTH:true}
      ssl-enable: ${EMAIL_CODE_NETEASE_SSL_ENABLE:true}
      starttls-enable: ${EMAIL_CODE_NETEASE_STARTTLS_ENABLE:false}
  llm:
    # LLM 大语言模型配置（用于 RAG 问答、摘要生成等）
    enabled: ${LLM_ENABLED:false}
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}
    # API 格式：chat-completions 走 /v1/chat/completions；responses 走 /v1/responses。
    api-format: ${LLM_API_FORMAT:chat-completions}
    timeout: ${LLM_TIMEOUT:20s}
  embedding:
    # 嵌入向量服务配置（用于语义检索）
    enabled: ${EMBEDDING_ENABLED:true}
    # 默认使用 Voyage AI 的多模态嵌入模型
    base-url: ${EMBEDDING_BASE_URL:https://api.voyageai.com}
    api-key: ${EMBEDDING_API_KEY:}
    model: ${EMBEDDING_MODEL:voyage-multimodal-3}
    timeout: ${EMBEDDING_TIMEOUT:20s}
    # 语义检索返回的最大候选数量
    top-k: ${EMBEDDING_TOP_K:8}
    # 语义相似度最低阈值（低于此分数的结果被过滤）
    score-threshold: ${EMBEDDING_SCORE_THRESHOLD:0.35}
  reranker:
    # 重排序器配置（对检索结果进行二次排序以提高相关性）
    enabled: ${RERANKER_ENABLED:true}
    # local=内置启发式重排序，api=调用外部重排序 API
    provider: ${RERANKER_PROVIDER:local}
    base-url: ${RERANKER_BASE_URL:}
    api-key: ${RERANKER_API_KEY:}
    model: ${RERANKER_MODEL:bge-reranker-v2-m3}
    timeout: ${RERANKER_TIMEOUT:10s}
    # 重排序候选数量（从检索结果中取前 N 个进行重排序）
    candidates: ${RERANKER_CANDIDATES:30}
    # 混合检索权重：语义检索权重
    retrieval-weight: ${RERANKER_RETRIEVAL_WEIGHT:0.55}
    # 混合检索权重：词法检索（BM25）权重
    lexical-weight: ${RERANKER_LEXICAL_WEIGHT:0.45}
  vector-store:
    # 向量数据库配置（可选，用于存储和检索嵌入向量）
    enabled: ${VECTOR_STORE_ENABLED:false}
    provider: ${VECTOR_STORE_PROVIDER:qdrant}
    base-url: ${VECTOR_STORE_BASE_URL:}
    api-key: ${VECTOR_STORE_API_KEY:}
    # 向量集合名称（包含模型标识以区分不同嵌入模型的数据）
    collection: ${VECTOR_STORE_COLLECTION:learning_assistant_chunks_voyage_multimodal_3}
    timeout: ${VECTOR_STORE_TIMEOUT:10s}
  query-expansion:
    # 查询扩展配置（通过 LLM 生成相关查询以提高检索召回率）
    enabled: ${QUERY_EXPANSION_ENABLED:true}
    # 最大扩展查询数量
    max-queries: ${QUERY_EXPANSION_MAX_QUERIES:4}
    # LLM 不可用时是否回退到本地规则扩展
    local-fallback: ${QUERY_EXPANSION_LOCAL_FALLBACK:true}
    # HyDE（假设性文档嵌入）：先让 LLM 生成假设性答案，再用答案的嵌入进行检索
    hyde-enabled: ${QUERY_EXPANSION_HYDE_ENABLED:false}
    # HyDE 结果在最终排序中的权重
    hyde-weight: ${QUERY_EXPANSION_HYDE_WEIGHT:0.72}
  rag-evaluation-scheduler:
    # RAG 评估调度器：定期运行已保存的评估套件以监控 RAG 质量
    enabled: ${RAG_EVALUATION_SCHEDULER_ENABLED:true}
    # 扫描间隔（多久检查一次是否有待运行的评估任务）
    scan-interval: ${RAG_EVALUATION_SCHEDULER_SCAN_INTERVAL:30m}
