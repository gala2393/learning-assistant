spring:
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: false

server:
  port: ${SERVER_PORT:8080}

app:
  llm:
    enabled: ${LLM_ENABLED:true}
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}
    timeout: ${LLM_TIMEOUT:30s}
  embedding:
    enabled: ${EMBEDDING_ENABLED:false}
    base-url: ${EMBEDDING_BASE_URL:}
    api-key: ${EMBEDDING_API_KEY:}
    model: ${EMBEDDING_MODEL:text-embedding-v3}
    timeout: ${EMBEDDING_TIMEOUT:30s}
    top-k: ${EMBEDDING_TOP_K:5}
    score-threshold: ${EMBEDDING_SCORE_THRESHOLD:0.55}
