# 生产/服务器部署 Compose。
# 使用方式：
# 1. Copy-Item deploy/server.env.example deploy/server.env
# 2. 修改 deploy/server.env 中的密码、域名、模型密钥。
# 3. docker compose up -d --build
#
# 说明：
# - 前端由 Nginx 容器托管，并把 /api 反向代理到 backend。
# - backend、mysql、redis、qdrant 在同一个 Docker 网络内通信。
# - Qdrant 的外部端口默认绑定到 127.0.0.1，服务器公网不会直接暴露向量库。

services:
  mysql:
    image: mysql:8.0
    container_name: learning-assistant-mysql
    restart: unless-stopped
    env_file:
      - ./deploy/server.env
    environment:
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # 使用容器环境变量中的 root 密码做本地 ping，避免后端在 MySQL 未就绪时启动失败。
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - learning-net

  redis:
    image: redis:7-alpine
    container_name: learning-assistant-redis
    restart: unless-stopped
    env_file:
      - ./deploy/server.env
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 20
    networks:
      - learning-net

  qdrant:
    image: qdrant/qdrant:v1.12.6
    container_name: learning-assistant-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    networks:
      - learning-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learning-assistant-backend
    restart: unless-stopped
    env_file:
      - ./deploy/server.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      # 持久化用户上传资料、PDF 页面预览图、OCR 中间文件等业务数据。
      - app_files:/data/learning-assistant-files
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - learning-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 容器化部署走同源 /api，由前端 Nginx 转发给 backend。
        VITE_API_BASE: /api
    container_name: learning-assistant-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - learning-net

networks:
  learning-net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  qdrant_data:
  app_files:
